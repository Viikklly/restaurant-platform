# restaurant-platform/infrastructure/config-repo/kitchen-service.yml

server:
  port: 8083

spring:
  application:
    name: kitchen-service
  
  datasource:
    url: jdbc:postgresql://postgres-kitchen:5432/kitchendb
    username: ${KITCHEN_DB_USER:postgres}
    password: ${KITCHEN_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate

  
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: kitchen-group

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: ${spring.application.name}


app:
  kafka:
    topics:
      order-created: order-service.order.created         # Топик "заказ создан"
      order-paid: order-service.order.paid               # Топик "заказ оплачен"
      kitchen-order-ready: kitchen-service.order.ready
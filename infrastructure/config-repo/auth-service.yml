# restaurant-platform/infrastructure/config-repo/auth-service.yml
# application.yml + auth-service.yml = полный конфиг



server:
  port: 8081

spring:
  application:
    name: auth-service        # Имя в Eureka (другие сервисы ищут по этому имени)
  main:
    web-application-type: servlet


  # БД
  datasource:
    # URL подключения к PostgreSQL
    url: jdbc:postgresql://postgres-auth:5432/authdb

    username: ${AUTH_DB_USER:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
    
    driver-class-name: org.postgresql.Driver
  
  # НАСТРОЙКИ JPA
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: ${spring.application.name}
  

# SPRING_PROFILES_ACTIVE=test
# restaurant-platform/infrastructure/config-repo/application-test.yml
# Для юнит и интеграционных тестов
#
# Spring загружает application-test.yml из src/main/resources (если есть).
#Подключается к Config Server (config-service:8888).
#Config Server отдаёт config-repo/application-test.yml (H2).
#Liquibase должен быть отключён, потому что H2.



spring:
  config:
    activate:
      on-profile: test

  # отключаем Liquibase в тестах (H2 + create-drop)
  liquibase:
    enabled: false

  # H2 - легковесная in-memory база данных
  # Не требует установки, работает в памяти
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Для тестов достаточно маленького пула
  datasource.hikari:
    maximum-pool-size: 2

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Создать таблицы для теста, удалить после

  # Embedded Kafka - запускается внутри теста
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

  # Embedded Redis на случайном порту
  data:
    redis:
      host: localhost
      port: 63790
      database: 0

# Отключаем Eureka для тестов (не нужна)
eureka:
  client:
    enabled: false

logging:
  file:
    path: logs/test
  level:
    com.restaurant: DEBUG

app:
  gateway:
    jwt-filter-enabled: false

# API Gateway - единая точка входа для всех клиентов
# Все запросы идут на порт 8080, Gateway распределяет их по сервисам


server:
  port: 8090
  # Порт, на котором будет запущен API Gateway
  # Это ЕДИНАЯ ТОЧКА ВХОДА для всех клиентов


# НАСТРОЙКИ SPRING CLOUD GATEWAY
spring:
  application:
    name: gateway-service

  cloud:
    gateway:

      # Настройки Netty
      httpclient:
        connect-timeout: 5000         # 5 секунд (соединение)
        response-timeout: 15s          # 15 секунд (ожидание ответа)
        pool:
          max-connections: 200
          max-idle-time: 5s
          max-life-time: 60s

      server:
        netty:
          max-connections: 500            # Максимальное количество одновременных TCP-соединений
          max-pending-requests: 100       # Максимальный размер очереди ожидающих запросов

      # Глобальные фильтры (применяются ко всем маршрутам)
      default-filters:
        # Добавляем correlation ID в каждый запрос
        - name: AddRequestHeader
          args:
            # X-Correlation-Id - сквозной идентификатор запроса. Нужен для трассировки в распределенной системе.
            # Когда запрос проходит через 5 сервисов, по этому ID можно восстановить весь путь.
            name: X-Correlation-Id
            value: "${spring.cloud.gateway.correlation-id:${random.uuid}}"
        # LogRequestFilter - логирует каждый запрос: метод, путь, статус, время выполнения.
        # Без этого дебажить проблемы невозможно
        # - name: LogRequestFilter


      # routes: список маршрутов (правил перенаправления запросов)
      # Каждый маршрут определяет: какой запрос куда отправлять
      routes:

        # AUTH SERVICE (СЕРВИС АУТЕНТИФИКАЦИИ)
        - id: auth-service
          # id: уникальный идентификатор маршрута
          # Используется для логирования, мониторинга и отладки
          # Должен быть уникальным в пределах Gateway

          # uri: куда перенаправлять запрос
          # lb://AUTH-SERVICE - используем балансировщик нагрузки (Load Balancer)
          # lb = Load Balancer (ленточный балансировщик от Spring Cloud)
          # AUTH-SERVICE - имя сервиса в Eureka (должно совпадать с spring.application.name)
          # Gateway спрашивает у Eureka: "Где находится AUTH-SERVICE?"
          # Eureka отвечает: "На localhost:8081"
          # Gateway перенаправляет запрос туда
          uri: lb://AUTH-SERVICE
          predicates:
            # predicates: условия (предикаты), при которых срабатывает маршрут
            # Path=/auth/** - путь запроса должен начинаться с /auth/
            - Path=/auth/**
          filters:

            # Retry                               # количество повторных попыток (всего будет 4 вызова 1 + 3)
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE, INTERNAL_SERVER_ERROR      # на какие статусы ретраиться
                methods: GET, POST                                               # только для этих методов
                backoff:
                  firstBackoff: 500ms                                     # первая задержка
                  maxBackoff: 2s                                          # максимальная задержка
                  factor: 2                                               # множитель увеличения задержки

            # Retry обычно ставят перед CircuitBreaker Так ретраи не попадают в статистику CircuitBreaker'а и не вызывают ложного размыкания.


            # Rate limiting для защиты от брутфорса и от DDoS атак
            # Redis хранит счетчики, чтобы ограничения работали даже при перезапуске gateway
            #- name: RequestRateLimiter
            #   args:
            #    key-resolver: "#{@ipKeyResolver}"       # IP KeyResolver - защита от брутфорса на логине (один IP не может долбить бесконечно)
            #    redis-rate-limiter.replenishRate: 5     # replenishRate: 5 означает "5 запросов в секунду"
            #    redis-rate-limiter.burstCapacity: 10    # максимум 10 burst
            # Rate Limiter - ЗАЩИТА ОТ DDoS
            - name: RequestRateLimiter # ограничение частоты запросов
              args:
                key-resolver: "#{@ipKeyResolver}"   # идентификатор клиента (по IP) в class RateLimiterConfig
                redis-rate-limiter.replenishRate: 50   # скорость пополнения токенов в секунду (50/сек чтобы исключить DDoS или брутфорс)
                redis-rate-limiter.burstCapacity: 100   # максимальный "запас" токенов


            # Circuit breaker
            # Автоматический выключатель
            # При ошибках → размыкаем цепь → мгновенно возвращаем fallback response
            #Через 5 секунд пробуем снова (half-open)
            #Если починили - закрываем цепь
            # Circuit Breaker - ЗАЩИТА ОТ ПАДЕНИЙ
            - name: CircuitBreaker
              args:
                name: authService                     # имя настраиваемого breaker'а
                fallbackUri: forward:/fallback/auth   # куда перенаправить при ошибке (Вместо ошибки 500 возвращает заранее подготовленный ответ (например: "Сервис временно недоступен, попробуйте позже").)


          metadata:
            response-timeout: 10s                                         # для медленных операций
            description: "Authentication and registration (public)"



        # ORDER SERVICE (СЕРВИС ЗАКАЗОВ)
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
          filters:
            # Retry
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE, INTERNAL_SERVER_ERROR
                methods: GET
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2s
                  factor: 2
            # JWT фильтр (проверяет токен и добавляет X-User-Id)
            # Без него любой мог отправить запрос к /api/orders без токена!

            #- name: jwtAuthenticationFilter

            # Rate Limiter - ЗАЩИТА ОТ DDoS
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"        # ← IP
                redis-rate-limiter.replenishRate: 50      # ← 5 запросов/сек с IP
                redis-rate-limiter.burstCapacity: 100     # ← всплеск до 10
            # Circuit Breaker - ЗАЩИТА ОТ ПАДЕНИЙ
            - name: CircuitBreaker
              args:
                name: orderService
                fallbackUri: forward:/fallback/orders

          metadata:
            description: "Order management"



        # KITCHEN SERVICE (СЕРВИС КУХНИ)
        - id: kitchen-service
          uri: lb://KITCHEN-SERVICE
          predicates:
            - Path=/api/kitchen/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE
                methods: GET,PUT
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2s
                  factor: 2
            #- name: jwtAuthenticationFilter
            # Rate Limiter - защита от DDoS
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"        # ← IP
                redis-rate-limiter.replenishRate: 50      # ← 5 запросов/сек с IP
                redis-rate-limiter.burstCapacity: 100     # ← всплеск до 10
            #Circuit Breaker - защита от падений
            - name: CircuitBreaker
              args:
                name: kitchenService
                fallbackUri: forward:/fallback/kitchen

          metadata:
            description: "Kitchen management"


        # PAYMENT SERVICE (СЕРВИС ПЛАТЕЖЕЙ)
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**
          filters:
            # источник запроса
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: gateway

            #- name: jwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"     # IP
                redis-rate-limiter.replenishRate: 2   # 2 платежа/сек с IP
                redis-rate-limiter.burstCapacity: 3   # всплеск до 3
            # Circuit Breaker - защита от падений
            - name: CircuitBreaker
              args:
                name: paymentService
                fallbackUri: forward:/fallback/payments
          # нет Retry что бы избежать двойной оплаты
          metadata:
            description: "Payment processing (auth disabled)"


        # NOTIFICATION SERVICE
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
          filters:
            # Источник запроса
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: gateway

            #- name: jwtAuthenticationFilter

              # Rate Limiter
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"       # IP
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
              # Circuit Breaker
            - name: CircuitBreaker
              args:
                name: notificationService
                fallbackUri: forward:/fallback/notification
          metadata:
            description: "Notifications"

        # FALLBACK ROUTE
        # Когда Circuit Breaker срабатывает, Gateway перенаправляет запрос сюда
        #Fallback возвращает понятную ошибку: "Сервис временно недоступен"
        #Без этого пользователь увидел бы таймаут через 30 секунд или 500 ошибку
        - id: fallback-route
          uri: forward:/fallback
          predicates:
            - Path=/fallback/**
          metadata:
            description: "Запасные пути для circuit breakers"

  # Redis для Rate Limiting
  # Rate Limiter требует Redis для хранения счетчиков
  #Без Redis ограничения будут работать только в одном экземпляре gateway
  #С Redis - даже если запустишь 3 копии gateway, лимиты будут общими
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 500ms    # Если Redis не ответил за 500 мс — лучше пропустить запрос (fail-open), чем убить Gateway.
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

# JWT Configuration (для валидации)
app:
  gateway:
    jwt-filter-enabled: false # для разработки пока отключаем
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      authService:
        registerHealthIndicator: true                       # показывать статус в /actuator/health
        slidingWindowSize: 10                               # смотрим на последние 10 запросов
        minimumNumberOfCalls: 5                             # минимум 5 вызовов, прежде чем принимать решение
        permittedNumberOfCallsInHalfOpenState: 3            # в полуоткрытом состоянии пробуем 3 запроса
        automaticTransitionFromOpenToHalfOpenEnabled: true  # автоматически пробовать через N секунд
        waitDurationInOpenState: 30s                         # сколько ждать перед попыткой восстановления
        failureRateThreshold: 50                            # при 50% ошибок размыкаем цепь
      orderService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
      kitchenService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
      paymentService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50


  # Retry настройки
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - java.net.ConnectException
          - java.net.SocketTimeoutException

# Actuator
# мониторинг и наблюдаемость системы.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  metrics:
    # метрики RESILIENCE4J
    enable:
      resilience4j: true
    tags:
      application: gateway-service    # добавляет тег ко всем метрикам
  tracing:
    sampling:
      probability: 1.0      # 1.0 = трассируем 100% запросов для разработки!

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    hostname: ${spring.application.name}

# Logging
logging:
  level:
    com.restaurant.gateway_service: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: DEBUG
    org.springframework.data.redis: DEBUG



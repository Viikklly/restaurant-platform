# Настройка сбора логов
# promtail — это "сборщик" логов
# Он смотрит на все контейнеры Docker и читает их логи
# Каждые 5 секунд проверяет, не появились ли новые контейнеры
# Отправляет логи в Loki по адресу http://loki:3100
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push            # Куда отправлять логи

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock             # Подключается к Docker
        refresh_interval: 5s                          # Проверяет новые контейнеры каждые 5 секунд
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_image]
        regex: '([^:]+):.*'
        target_label: image

      - source_labels: [ __meta_docker_container_name ]
        regex: '.*-(auth-service|order-service|kitchen-service|payment-service|gateway-service|discovery-service|config-service)'
        target_label: service
        replacement: '${1}'


      - source_labels: [ __meta_docker_container_name ]
        regex: 'restaurant-([a-z-]+)-.*'
        target_label: service
        replacement: '${1}'

      - source_labels: [ __meta_docker_container_name ]
        target_label: job
        replacement: "docker"

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            attrs: attrs
      - json:
          source: attrs
          expressions:
            container_name: container_name
            image_name: image_name
      - json:
          source: log
          expressions:
            level: level
            timestamp: timestamp
            message: message
            traceId: traceId
            correlationId: correlationId
            application: application
            mdc: mdc
      - labels:
          level: level
          #service: application
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          environment: restaurant
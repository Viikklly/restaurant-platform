# Настройка сбора логов
# promtail — это "сборщик" логов
# Он смотрит на все контейнеры Docker и читает их логи
# Каждые 5 секунд проверяет, не появились ли новые контейнеры
# Отправляет логи в Loki по адресу http://loki:3100
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push            # Куда отправлять логи

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock             # Подключается к Docker
        refresh_interval: 5s                          # Проверяет новые контейнеры каждые 5 секунд

    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container

      - source_labels: [__meta_docker_container_image]
        regex: '([^:]+):.*'
        target_label: image

      # Извлекаем service из имени контейнера (из /restaurant-order-service получаем order-service)
      - source_labels: [__meta_docker_container_name]
        regex: '/restaurant-(.*)'
        target_label: service
        replacement: '${1}'

      - source_labels: [__meta_docker_container_name]
        target_label: job
        replacement: "docker"

    pipeline_stages:
      # 1. Docker-обёртка. Docker сам оборачивает stdout контейнера
      # в JSON с полями log/stream/time. Этот парсинг работает для всех контейнеров.
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            attrs: attrs
      - json:
          source: attrs
          expressions:
            container_name: container_name
            image_name: image_name

      # 2. Если это нагрузочный контейнер — парсим k6/Gatling/JMeter
      - match:
          selector: '{container=~"restaurant-k6|restaurant-gatling|restaurant-jmeter"}'
          stages:
            - regex:
                source: log
                expression: '^(?P<level>INFO|WARN|ERROR|DEBUG)\[(?P<ts>[^\]]+)\]\s+(?P<message>.*)$'
            - labels:
                level: level

      # 3. Spring-сервисы: парсим JSON (если logback пишет JSON в stdout)
      - match:
          selector: '{container!~"restaurant-k6|restaurant-gatling|restaurant-jmeter"}'
          stages:
            # Пытаемся распарсить как JSON. Если не получится — лог не потеряется,
            # а просто уйдет в Loki в виде сырой строки.
            - json:
                source: log
                expressions:
                  level: level
                  timestamp: timestamp
                  message: message
                  traceId: traceId
                  correlationId: correlationId
                  application: application
                  mdc: mdc
            - labels:
                level: level
                traceId: traceId
                correlationId: correlationId
            # Оставляем RFC3339, чтобы избежать ошибок с наносекундами, если формат отличается
            - timestamp:
                source: timestamp
                format: RFC3339
            - labels:
                environment: restaurant
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            attrs: attrs

      - json:
          source: attrs
          expressions:
            container_name: container_name
            image_name: image_name

      - regex:
          source: container_name
          expression: '/(?P<service>[a-z-]+)-\w+/'
          labels:
            service: service

      - static_labels:
          environment: restaurant
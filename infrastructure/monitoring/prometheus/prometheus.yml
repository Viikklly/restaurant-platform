
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: restaurant

rule_files:
  - "rules.yml"
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Только микросервисы, без config-service
  - job_name: 'restaurant-services'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'auth-service:8081'
          - 'order-service:8082'
          - 'kitchen-service:8083'
          - 'payment-service:8084'
          - 'gateway-service:8090'

    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):.*'
        replacement: '${1}'
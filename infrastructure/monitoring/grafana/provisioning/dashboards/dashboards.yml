apiVersion: 1

providers:                             # Список провайдеров дашбордов
  - name: 'default'                    # Имя провайдера
    orgId: 1                           # ID организации в Grafana (обычно 1 - основная)
    folder: 'Restaurant Platform'      # В какой папке будут дашборды в интерфейсе
    type: file                         # Источник - файловая система
    disableDeletion: false             # Можно удалять дашборды через UI (false = можно)
    updateIntervalSeconds: 30          # Проверять изменения в файлах каждые 30 секунд
    allowUiUpdates: true               # Разрешить сохранять изменения из UI обратно в файлы
    options:
      path: /var/lib/grafana/dashboards  # Путь к папке с JSON-файлами дашбордов
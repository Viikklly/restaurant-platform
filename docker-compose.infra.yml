# для разработки
# Только БД и брокеры (PostgreSQL, Redis, Kafka)
# Запуск: docker-compose -f docker-compose.infra.yml up -d

services:
  # БАЗЫ ДАННЫХ (отдельные для каждого сервиса)

  # AUTH SERVICE DB
  postgres-auth:
    image: postgres:15
    container_name: restaurant-postgres-auth
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5437:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ORDER SERVICE DB
  postgres-order:
    image: postgres:15
    container_name: restaurant-postgres-order
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # KITCHEN SERVICE DB
  postgres-kitchen:
    image: postgres:15
    container_name: restaurant-postgres-kitchen
    environment:
      POSTGRES_DB: kitchendb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-kitchen-data:/var/lib/postgresql/data
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kitchendb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PAYMENT SERVICE DB
  postgres-payment:
    image: postgres:15
    container_name: restaurant-postgres-payment
    environment:
      POSTGRES_DB: paymentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # REDIS (КЭШ)
  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - restaurant-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # KAFKA (БРОКЕР СООБЩЕНИЙ) - ПОЛНОСТЬЮ РАБОЧАЯ ВЕРСИЯ
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: restaurant-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: restaurant-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS:  PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - restaurant-network
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # KAFKA UI (для просмотра сообщений)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: restaurant-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - restaurant-network
    depends_on:
      - kafka

  # PGADMIN (для просмотра БД)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: restaurant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@restaurant.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - restaurant-network
    depends_on:
      - postgres-auth
      - postgres-order
      - postgres-kitchen
      - postgres-payment



  # МОНИТОРИНГ

  # PROMETHEUS
  prometheus:
    image: prom/prometheus:latest
    container_name: restaurant-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infrastructure/monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - restaurant-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  # ALERTMANAGER
  alertmanager:
    image: prom/alertmanager:latest
    container_name: restaurant-alertmanager
    volumes:
      - ./infrastructure/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - restaurant-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  # LOKI - ОДИН КОНТЕЙНЕР (режим all-in-one)
  loki:
    image: grafana/loki:3.0.0
    container_name: restaurant-loki
    volumes:
      #- ./infrastructure/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
      #- ./infrastructure/monitoring/loki/rules:/loki/rules:ro
    ports:
      - "3100:3100"
    #command: -config.file=/etc/loki/loki-config.yml
    networks:
      - restaurant-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s


  # PROMTAIL (сбор логов)
  promtail:
    image: grafana/promtail:latest
    container_name: restaurant-promtail
    volumes:
      - ./infrastructure/monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - restaurant-network
    restart: unless-stopped
    depends_on:
      - loki
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9080/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # GRAFANA
  grafana:
    image: grafana/grafana:latest
    container_name: restaurant-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infrastructure/monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    networks:
      - restaurant-network
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # JAEGER
  jaeger:
    image: jaegertracing/jaeger:latest # Или зафиксируйте версию: 2.15.0
    container_name: restaurant-jaeger
    ports:
      # UI и API
      - "16686:16686"
      # Zipkin API (для Spring Boot)
      - "9411:9411"
      # OTLP (OpenTelemetry) для современных клиентов
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
    environment:
      # Используем память для хранения (быстро и без прав)
      - JAEGER_STORAGE_TYPE=memory
      # Включаем все коллекторы
      - JAEGER_COLLECTOR_OTLP_ENABLED=true
      - JAEGER_OTLP_HOST=0.0.0.0
    networks:
      - restaurant-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:16686/api/services" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
# СЕТИ
networks:
  restaurant-network:
    driver: bridge
    # Bridge — стандартный драйвер сети Docker
    #Создает изолированную виртуальную сеть на одном хосте
    #Контейнеры в bridge сети могут общаться друг с другом
    #Контейнеры изолированы от других сетей

# ------------ // ------------
# ТОМА (ПЕРСИСТЕНТНОСТЬ ДАННЫХ)
volumes:
  # Docker Volumes — это механизм постоянного хранения данных, который позволяет
  # сохранять информацию даже после удаления и пересоздания контейнеров

  # Ключевые моменты:
  # Тома сохраняют данные при перезапуске контейнеров
  # Каждая БД имеет свой изолированный том
  #Тома не удаляются при docker-compose down (без -v)
  #Данные хранятся в /var/lib/docker/volumes/ на хосте
  postgres-auth-data:
  postgres-order-data:
  postgres-kitchen-data:
  postgres-payment-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  jaeger-data:
  alertmanager-data:
  loki-data:


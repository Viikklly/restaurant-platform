server:
  port: 8090

spring:
  config:
    activate:
      on-profile: dev
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
              filters:
                - AddRequestHeader=X-Request-Source, gateway
            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/orders/**
              filters:
                - AddRequestHeader=X-Request-Source, gateway
            - id: kitchen-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/kitchen/**
              filters:
                - AddRequestHeader=X-Request-Source, gateway
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/payment/**
              filters:
                - AddRequestHeader=X-Request-Source, gateway
            - id: notification-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/notification/**
              filters:
                - AddRequestHeader=X-Request-Source, gateway

eureka:
  client:
    enabled: false
databaseChangeLog:
  - changeSet:
      id: 002-create-indexes
      author: dev-team
      changes:
        - createIndex:
            tableName: payment_transactions
            indexName: idx_payment_transactions_order_id
            columns:
              - column: { name: order_id }
        - createIndex:
            tableName: payment_transactions
            indexName: idx_payment_transactions_user_id
            columns:
              - column: { name: user_id }
        - createIndex:
            tableName: payment_transactions
            indexName: idx_payment_transactions_status
            columns:
              - column: { name: status_payment }
      rollback:
        - dropIndex: { tableName: payment_transactions, indexName: idx_payment_transactions_order_id }
        - dropIndex: { tableName: payment_transactions, indexName: idx_payment_transactions_user_id }
        - dropIndex: { tableName: payment_transactions, indexName: idx_payment_transactions_status }

# application-test.yml (для order-service)
# services/order-service/src/test/resources/application-test.yml

# Spring загружает src/test/resources/application-test.yml.
# В нём spring.cloud.config.enabled: false → Config Server не подключается.
# config-repo/application-test.yml не подтягивается.
# Тест использует Testcontainers PostgreSQL.
# Liquibase накатывает миграции. ✅
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  # НЕ УКАЗЫВАЕМ datasource здесь — он будет подставлен из @DynamicPropertySource

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml


  kafka:
    bootstrap-servers: ""

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging:
  level:
    org.springframework: WARN
    com.restaurant.order_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
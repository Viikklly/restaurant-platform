# порт, на котором будет работать Config Server
server:
  port: 8888

spring:
  application:
    name: config-service # Имя приложения
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:///config-repo
eureka:
  client:
    service-url:
      # Адрес Eureka сервера для регистрации
      defaultZone: http://localhost:8761/eureka/
    #  Config Server будет виден в Eureka под именем config-service
    fetch-registry: true
    # Config Server будет знать о других сервисах
    register-with-eureka: true

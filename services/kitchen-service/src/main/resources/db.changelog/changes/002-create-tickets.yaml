databaseChangeLog:
  - changeSet:
      id: 002-create-tickets
      author: dev-team
      changes:
        - createTable:
            schemaName: kitchen_schema
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: items
                  type: "text[]"
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: ready_at
                  type: TIMESTAMP
      rollback:
        - dropTable:
            schemaName: kitchen_schema
            tableName: tickets
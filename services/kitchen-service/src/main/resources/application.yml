spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-service:8888}

  # Fallback datasource — если Config Server недоступен,
  # используем PostgreSQL из Docker-сети (НЕ H2!)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-kitchen:5432/kitchendb}
    username: ${KITCHEN_DB_USER:postgres}
    password: ${KITCHEN_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: kafka:29092
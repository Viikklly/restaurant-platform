spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-service:8888}

  # Fallback datasource — если Config Server недоступен,
  # используем PostgreSQL из Docker-сети (НЕ H2!)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-auth:5432/authdb}
    username: ${AUTH_DB_USER:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 900000
  refresh-expiration: 604800000

app:
  security:
    jwt-filter-enabled: false
databaseChangeLog:
  - changeSet:
      id: 004-fix-test-user-passwords
      author: dev-team
      changes:
        # Исправляем BCrypt-хэш для пароля "password123"
        # (предыдущий хэш в 002-seed-test-users.yaml не соответствовал паролю)
        - update:
            tableName: users
            where: "email IN ('alice@test.com', 'bobi@test.com', 'cap@test.com')"
            columns:
              - column:
                  name: password
                  value: "$2a$10$odlvLK2k6kUBUnB01eF19uC/oy3tZWR1N3FvufxZnfnbKrbLaGyRi"
      rollback:
        - update:
            tableName: users
            where: "email IN ('alice@test.com', 'bobi@test.com', 'cap@test.com')"
            columns:
              - column:
                  name: password
                  value: "$2a$10$N.zmdr9k7uOCQb376NoUnuTJ8iAt6Z5EHsM8lE9lBOsl7iKTVEFDa"
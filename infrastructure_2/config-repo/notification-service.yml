# Notification Service - отправляет уведомления (email, SMS, push)
# ТОЛЬКО ПОЛУЧАЕТ сообщения из Kafka, НИЧЕГО НЕ ОТПРАВЛЯЕТ.
# ЧТО ДЕЛАЕТ: Отправляет уведомления (email, SMS, push, Telegram)
# ОСОБЕННОСТЬ: ТОЛЬКО ПОЛУЧАЕТ сообщения из Kafka, НИЧЕГО НЕ ОТПРАВЛЯЕТ

server:
  port: 8085



spring:
  application:
    name: notification-service
    # Имя в Eureka: другие сервисы могут найти Notification Service по этому имени
    # так как он только слушает Kafka, а не отвечает на запросы

  # KAFKA (ТОЛЬКО CONSUMER)
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      # group-id: идентификатор группы потребителей
      group-id: notification-group
      # key-deserializer: как превратить ключ сообщения из байтов в строку
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Ключ обычно содержит: ID заказа, ID пользователя, тип события
      # Пример ключа: "order-12345"

      # value-deserializer: как превратить тело сообщения из JSON в Java объект
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # Тело сообщения: JSON → Java объект
      # Пример: {"orderId": 123, "status": "PAID", "amount": 1500} → OrderEvent


      properties:
        # spring.json.trusted.packages: какие пакеты разрешены для десериализации
        spring.json.trusted.packages: "*"
        # "*" - доверять всем пакетам (для разработки)



# KAFKA ТОПИКИ (НА ЧТО ПОДПИСЫВАЕМСЯ)

app:
  kafka:
    topics:
      # СОБЫТИЯ ЗАКАЗОВ
      order-events: order-service.*
      # Слушаем ВСЕ топики, начинающиеся с "order-service."
      # - order-service.order.created     → "Ваш заказ принят"
      # - order-service.order.paid        → "Заказ оплачен, спасибо!"
      # - order-service.order.ready       → "Заказ готов к выдаче"
      # - order-service.order.cancelled   → "Заказ отменен"
      # - order-service.order.delivered   → "Заказ доставлен"

      # СОБЫТИЯ ПЛАТЕЖЕЙ
      payment-events: payment-service.*
      # Слушаем ВСЕ топики, начинающиеся с "payment-service."
      # - payment-service.payment.success → "Оплата прошла успешно" + чек
      # - payment-service.payment.failed  → "Ошибка оплаты, попробуйте другую карту"

      # СОБЫТИЯ КУХНИ
      kitchen-events: kitchen-service.*
      # Слушаем ВСЕ топики, начинающиеся с "kitchen-service."
      # - kitchen-service.kitchen.cooking.start → "Начали готовить ваш заказ"
      # - kitchen-service.kitchen.cooking.ready → "Блюдо готово!"




logging:
  level:
    # Детальное логирование уведомлений
    com.restaurant.notification: DEBUG
    com.restaurant.notification.email: DEBUG
    com.restaurant.notification.sms: DEBUG
    com.restaurant.notification.push: DEBUG

    # Логируем все входящие сообщения из Kafka
    com.restaurant.notification.kafka: DEBUG


# НЕТ eureka.client
#    - Notification Service не нужно, чтобы его находили другие сервисы
#    - Он сам ни к кому не обращается (только слушает Kafka и отправляет уведомления)


#  НЕТ spring.datasource
#    - Notification Service НЕ хранит данные (stateless)
#    - Уведомления отправляются и забываются

#  НЕТ spring.data.redis
#    - Кэш не нужен, так как нет состояния


#  НЕТ spring.kafka.producer
#    - Notification Service НИЧЕГО НЕ ОТПРАВЛЯЕТ в Kafka
#    - Он только получает сообщения (consumer)


# СХЕМА РАБОТЫ

# [Kafka Broker :9092]
#    │
#    ├── Топик: order-service.order.created ──┐
#    ├── Топик: order-service.order.paid ─────┤
#    ├── Топик: payment-service.payment.success┼──→ [Notification Service]
#    ├── Топик: kitchen-service.kitchen.ready ─┤    │
#    └── Топик: ... ───────────────────────────┘    │
#                                                     ▼
#                                            Определяет тип уведомления
#                                                     │
#                                    ┌────────────────┼────────────────┐
#                                    ▼                ▼                ▼
#                              [Email]            [SMS]             [Push]
#                              user@mail.com    +7 999 123-45-67    Мобильное
#                                                                   приложение